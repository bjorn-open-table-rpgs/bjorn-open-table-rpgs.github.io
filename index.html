---
---
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#0b0b0b">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ '/assets/baner.jpg' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="hero">
    <img src="{{ '/assets/baner.jpg' | relative_url }}" width="851" height="315"
         alt="Baner GRUZ-30: szkielet pomiędzy skalną ścianą a ruinami zamku">
  </header>
  <main>
    <p class="prompt">{{ site.title }}</p>
    <h1>Wybierz kampanię</h1>
    <p>Tu znajdziesz strony moich kampanii w formule Open Table. Kliknij kampanię, żeby zobaczyć kronikę, postacie i zasady.</p>
    <ul class="session-list">
      {% for k in site.data.kampanie %}
      <li>
        <a href="{{ k.url | relative_url }}">
          <strong>{{ k.title }}</strong>
          <p class="summary">{{ k.description }}</p>
        </a>
      </li>
      {% endfor %}
    </ul>
  </main>
  <footer class="site-footer">{{ site.title }}</footer>
</body>
</html>
